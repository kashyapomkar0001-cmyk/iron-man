name: Build Jarvis Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        run: |
          mkdir -p jarvis-android/app/src/main/java/com/jarvis/control
          mkdir -p jarvis-android/app/src/main/res/values

          cat > jarvis-android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JarvisControl"
          include(":app")
          EOF

          cat > jarvis-android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > jarvis-android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.jarvis.control'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.control'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > jarvis-android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Jarvis Control</string>
          </resources>
          EOF

          cat > jarvis-android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > jarvis-android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00AEEF</item>
              </style>
          </resources>
          EOF

          cat > jarvis-android/app/src/main/java/com/jarvis/control/MainActivity.kt <<'EOF'
          package com.jarvis.control

          import android.app.Activity
          import android.os.Bundle
          import android.hardware.camera2.CameraManager
          import android.content.Context
          import android.media.AudioManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private var flashlightOn = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(40, 80, 40, 40)

                  val title = TextView(this)
                  title.text = "🤖 JARVIS CONTROL"
                  title.textSize = 28f

                  val flashlight = Button(this)
                  flashlight.text = "🔦 Flashlight ON / OFF"

                  val volumeUp = Button(this)
                  volumeUp.text = "🔊 Volume UP"

                  val volumeDown = Button(this)
                  volumeDown.text = "🔉 Volume DOWN"

                  layout.addView(title)
                  layout.addView(flashlight)
                  layout.addView(volumeUp)
                  layout.addView(volumeDown)

                  setContentView(layout)

                  flashlight.setOnClickListener {
                      toggleFlashlight()
                  }

                  volumeUp.setOnClickListener {
                      changeVolume(AudioManager.ADJUST_RAISE)
                  }

                  volumeDown.setOnClickListener {
                      changeVolume(AudioManager.ADJUST_LOWER)
                  }
              }

              private fun toggleFlashlight() {
                  try {
                      val cameraManager =
                          getSystemService(Context.CAMERA_SERVICE) as CameraManager

                      val cameraId = cameraManager.cameraIdList.firstOrNull()

                      if (cameraId != null) {
                          flashlightOn = !flashlightOn
                          cameraManager.setTorchMode(cameraId, flashlightOn)
                      }

                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun changeVolume(direction: Int) {
                  val audioManager =
                      getSystemService(Context.AUDIO_SERVICE) as AudioManager

                  audioManager.adjustVolume(
                      direction,
                      AudioManager.FLAG_SHOW_UI
                  )
              }
          }
          EOF

      - name: Build APK
        working-directory: jarvis-android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Control-APK
          path: jarvis-android/app/build/outputs/apk/debug/app-debug.apk
