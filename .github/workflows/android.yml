name: Build Jarvis Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Create Android project
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p JarvisControl/app/src/main/java/com/jarvis/control
          mkdir -p JarvisControl/app/src/main/res/values

          cat > JarvisControl/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JarvisControl"
          include(":app")
          EOF

          cat > JarvisControl/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > JarvisControl/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > JarvisControl/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.jarvis.control'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.control'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > JarvisControl/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="JARVIS"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > JarvisControl/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > JarvisControl/app/src/main/java/com/jarvis/control/MainActivity.kt <<'EOF'
          package com.jarvis.control

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(40, 40, 40, 40)
                  }

                  val title = TextView(this).apply {
                      text = "JARVIS"
                      textSize = 40f
                      setTextColor(Color.BLACK)
                      gravity = Gravity.CENTER
                  }

                  val status = TextView(this).apply {
                      text = "JARVIS Android System Ready"
                      textSize = 18f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 30, 0, 0)
                  }

                  layout.addView(title)
                  layout.addView(status)

                  setContentView(layout)
              }
          }
          EOF

      # 5. Build APK
      - name: Build APK
        working-directory: JarvisControl
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      # 6. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-debug-apk
          path: JarvisControl/app/build/outputs/apk/debug/app-debug.apk                  
